name: build

# Tests on every OS, builds ready-to-run binaries for Windows and macOS on
# every push (download them from the run's "Artifacts"), and publishes them
# as a GitHub release when a tag like v3.0.0 is pushed.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: Screen capture smoke test
        if: runner.os != 'Linux'
        # CI machines may not grant screen access; this only reports.
        continue-on-error: true
        env:
          GF_SCREEN_TEST: "1"
        run: go test -run CaptureSmoke -v ./internal/platform

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            name: windows-x64
          - goarch: arm64
            name: windows-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p "dist/guitarflash-autoplay-${{ matrix.name }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/guitarflash-autoplay-${{ matrix.name }}/guitarflash-autoplay.exe" ./cmd/guitarflash-autoplay
          cp README.md LICENSE "dist/guitarflash-autoplay-${{ matrix.name }}/"
          cd dist && zip -r "guitarflash-autoplay-${{ matrix.name }}.zip" "guitarflash-autoplay-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guitarflash-autoplay-${{ matrix.name }}
          path: dist/guitarflash-autoplay-${{ matrix.name }}.zip

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build universal binary (Apple Silicon + Intel)
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          for arch in arm64 amd64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/guitarflash-autoplay-$arch" ./cmd/guitarflash-autoplay
          done
          out=dist/guitarflash-autoplay-macos
          mkdir -p "$out"
          lipo -create -output "$out/guitarflash-autoplay" build/guitarflash-autoplay-arm64 build/guitarflash-autoplay-amd64
          codesign --force --sign - "$out/guitarflash-autoplay"
          lipo -info "$out/guitarflash-autoplay"
          "$out/guitarflash-autoplay" -version
          cp README.md LICENSE "$out/"
          cd dist && zip -r guitarflash-autoplay-macos.zip guitarflash-autoplay-macos
      - uses: actions/upload-artifact@v4
        with:
          name: guitarflash-autoplay-macos
          path: dist/guitarflash-autoplay-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
